notes:
  - ja: "検討した上流（2026-11-16）：Open311 GeoReport v2 と、それを写した Smart Data Models の dataModel.IssueTracking（service_requests、services）。どちらも住民からの通報の記録で、日や順番を計画するための値（時間の幅、作業時間、量、技能）を持ちません。Open311 から受け継いだのは、依頼の種類のコード（serviceCode）、担当する自治体（jurisdiction）、依頼の日時（requestedAt）、受付中と完了の区別（requestStatus）です。datamodels.jp の Task は作業の記録で、依頼する人が何をいつ望むかは表しません。"
    en: "Upstream considered (2026-11-16): Open311 GeoReport v2, and Smart Data Models dataModel.IssueTracking that copies it (service_requests, services). Both record citizen reports and have none of the values needed to plan a day and an order (time windows, service time, amount, skills). From Open311 come the request kind (serviceCode), the responsible body (jurisdiction), when it was requested (requestedAt) and open versus closed (requestStatus). datamodels.jp's Task records work; it does not say what a requester wants and when."
  - ja: "時間の幅（timeWindows）、作業時間（serviceDuration）、量（load）、技能（skills）、優先度（priority）は、ルート最適化（VRP）のソフトウェアの job の値と同じ意味です（VROOM の time_windows、service、amount、skills、priority など）。依頼をそのまま最適化に渡し、結果（scheduledDate、scheduledWindow）を書き戻せます。priority は Task と同じ RFC 8984 の 0〜9 で、VROOM の 0〜100（大きいほど優先）とは向きが逆なので、変換が必要です。"
    en: "timeWindows, serviceDuration, load, skills and priority mean what a job of route optimisation (VRP) software means by them (VROOM's time_windows, service, amount, skills, priority). A request goes to an optimiser as it is, and the result (scheduledDate, scheduledWindow) is written back. priority is RFC 8984's 0 to 9, as in Task; VROOM's 0 to 100 (higher first) runs the other way, so it is converted."
  - ja: "flexibility と preferredDate は、時間の幅とは別に、依頼した人がその日をどれだけ必要としているかを表します。最適化は時間の幅の中で負担の少ない日を選べますが、引っ越しの日のように理由があるときは、負担が大きくてもその日にします。この判断（どの日を受け、どの日を示すか）はルールで決めるもので、モデルは材料だけを持ちます。"
    en: "flexibility and preferredDate say, apart from the time windows, how much the requester needs that day. An optimiser can choose the cheapest day within the windows, but a day with a reason (a move-out) is kept even when it costs more. That decision (which day to accept, which days to offer) is made by rules; the model only holds what they need."
  - ja: "依頼した人の名前、住所、電話番号は持ちません。requester で別のエンティティを指し、見せる相手をエンティティの型で分けられるようにします（現場の班には場所と中身を、連絡先は事務の担当だけに）。位置は品目を出す場所で、住所である必要はありません。description は依頼した人の言葉なので、個人を特定できることが書かれることがあります。"
    en: "No name, address or phone number of the requester: requester points to another entity, so who may see it can be set per entity type (the crew sees the place and the items, only the office sees contacts). location is where the items are put out and need not be an address. description is in the requester's words and may contain personal data."
  - ja: "lines は品目ごとの行で、CatalogItem を指し、依頼したときの名前も残します（一覧の名前が後で変わっても、依頼の中身がわかるように）。JSON の配列の Property です。"
    en: "lines has one row per item, pointing to a CatalogItem and keeping the name at the time of the request (so the request still reads right after the list renames an item). It is a Property holding a JSON array."
  - ja: "未決の点：計画そのもの（RoutePlan：日、車両、班、立ち寄る順番）と、車両（Smart Data Models の FleetVehicle で足りるか）、班（Crew）のモデルは、まだありません。scheduledDate の先に、どの計画に入ったかを指す属性を足す予定です。"
    en: "Open: the plan itself (RoutePlan: the day, the vehicle, the crew, the order of the stops), and models for vehicles (whether Smart Data Models' FleetVehicle is enough) and crews (Crew) do not exist yet. An attribute pointing from a request to the plan it is in comes with them."
  - ja: "このノードで試す段階（draft）です。最初の実装は Pointsman の収集デモ（geolonia/pointsman-demo-collection）で、ほかの用途（配達、点検）でも合うとわかったら datamodels.jp に提案します。"
    en: "A draft, tried in this node first. The first implementation is the Pointsman collection demo (geolonia/pointsman-demo-collection); when it fits other uses too (deliveries, inspections), it is proposed to datamodels.jp."
